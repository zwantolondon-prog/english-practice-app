<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Practice Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-lg my-4 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">English Practice Lab</h1>
    <p class="text-xs text-slate-500 mt-1">Platform Latihan Soal & Simulasi Ujian Interaktif</p>
  </header>

  <!-- 1. HALAMAN MENU DINAMIS -->
  <section id="menu-view" class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col gap-5">
    
    <!-- Filter Jumlah Soal -->
    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
      <div>
        <label class="block text-[11px] font-bold uppercase text-slate-400">Jumlah Soal</label>
        <select id="limit-select" class="bg-transparent font-bold text-sm text-slate-700 outline-none cursor-pointer">
          <option value="10">10 Soal (Cepat)</option>
          <option value="20" selected>20 Soal (Standar)</option>
          <option value="50">50 Soal (Ujian)</option>
          <option value="100">100 Soal (Maraton)</option>
        </select>
      </div>
      <div class="text-right">
        <span class="text-[11px] font-bold uppercase text-slate-400 block">Status Database</span>
        <span id="total-db-count" class="text-sm font-extrabold text-indigo-600">Terhubung</span>
      </div>
    </div>

    <!-- Tombol Simulasi Ujian Tryout (Acak Semua) -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Simulasi Lengkap</h2>
      <button onclick="startQuiz('all', 'all')" class="w-full flex items-center justify-between p-4 border-2 border-indigo-500 bg-indigo-50/50 hover:bg-indigo-100/50 rounded-xl transition text-left group">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base">🎯</span>
            <span class="font-bold text-sm text-indigo-900 group-hover:text-indigo-600">Simulasi Tryout Lengkap</span>
          </div>
          <p class="text-xs text-slate-500 mt-1">Mengacak gabungan seluruh paket dari database</p>
        </div>
        <span class="text-[11px] font-bold bg-indigo-600 text-white px-2.5 py-1 rounded-md shadow-sm">Mulai</span>
      </button>
    </div>

    <!-- Paket Kategori -->
    <div>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Pilih Berdasarkan Kategori</h2>
      <div id="category-list" class="flex flex-col gap-3">

        <!-- 1. Grammar Basic -->
        <div class="border border-slate-200 rounded-xl p-3.5 bg-white flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <button onclick="startQuiz('package', 'grammar_basic')" class="font-bold text-sm text-slate-800 hover:text-indigo-600">
              📘 GRAMMAR BASIC
            </button>
            <span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Paket Dasar</span>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">
            <button onclick="startQuiz('topic', 'Simple Present')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Simple Present</button>
            <button onclick="startQuiz('topic', 'Simple Past')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Simple Past</button>
            <button onclick="startQuiz('topic', 'Present Continuous')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Present Continuous</button>
            <button onclick="startQuiz('topic', 'Present Perfect')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Present Perfect</button>
            <button onclick="startQuiz('topic', 'Passive Voice')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Passive Voice</button>
            <button onclick="startQuiz('topic', 'Modal Verbs')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Modal Verbs</button>
          </div>
        </div>

        <!-- 2. Grammar Advanced -->
        <div class="border border-slate-200 rounded-xl p-3.5 bg-white flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <button onclick="startQuiz('package', 'grammar_advanced')" class="font-bold text-sm text-slate-800 hover:text-indigo-600">
              📕 GRAMMAR ADVANCED
            </button>
            <span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Paket Lanjutan</span>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">
            <button onclick="startQuiz('topic', 'Conditional Sentences')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Conditional Sentences</button>
            <button onclick="startQuiz('topic', 'Gerunds & Infinitives')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Gerunds & Infinitives</button>
            <button onclick="startQuiz('topic', 'Relative & Reduced Clauses')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Relative Clauses</button>
            <button onclick="startQuiz('topic', 'Subjunctive & Inversion')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Inversion & Subjunctive</button>
          </div>
        </div>

        <!-- 3. Vocabulary Intermediate -->
        <div class="border border-slate-200 rounded-xl p-3.5 bg-white flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <button onclick="startQuiz('package', 'vocab_intermediate')" class="font-bold text-sm text-slate-800 hover:text-indigo-600">
              📙 VOCABULARY INTERMEDIATE
            </button>
            <span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Kosakata</span>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">
            <button onclick="startQuiz('topic', 'Synonyms')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Synonyms</button>
            <button onclick="startQuiz('topic', 'Antonyms')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Antonyms</button>
            <button onclick="startQuiz('topic', 'Idioms & Expressions')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Idioms & Expressions</button>
          </div>
        </div>

        <!-- 4. TOEFL Prep -->
        <div class="border border-slate-200 rounded-xl p-3.5 bg-white flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <button onclick="startQuiz('package', 'toefl_prep')" class="font-bold text-sm text-slate-800 hover:text-indigo-600">
              🎓 TOEFL & IELTS PREPARATION
            </button>
            <span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Ujian Resmi</span>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">
            <button onclick="startQuiz('topic', 'Academic Vocabulary')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Academic Vocab</button>
            <button onclick="startQuiz('topic', 'Structure & Written Expression')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Structure Expression</button>
            <button onclick="startQuiz('topic', 'Academic Collocations')" class="text-[11px] bg-slate-50 border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 px-2.5 py-1 rounded-lg">Academic Collocations</button>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- 2. HALAMAN LATIHAN / KUIS -->
  <main id="quiz-view" class="hidden w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col gap-5">
    <div class="flex justify-between items-center text-xs font-semibold pb-3 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <span id="topic-tag" class="bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1 rounded-md">Grammar</span>
        <span id="question-count" class="text-slate-400 font-medium">Soal 1</span>
      </div>
      <span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-bold" id="score-display">Skor: 0</span>
    </div>

    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
      <div class="flex items-start justify-between gap-3">
        <h2 id="question-text" class="text-base sm:text-lg font-semibold text-slate-800 leading-snug">Memuat soal...</h2>
        <button id="btn-speak" class="p-2 text-indigo-500 hover:text-indigo-700 hover:bg-indigo-100/50 rounded-lg transition" title="Dengarkan Suara (Audio)">
          🔊
        </button>
      </div>
      <p id="question-translation" class="text-xs text-slate-500 mt-2 pt-2 border-t border-slate-200/60 italic leading-relaxed">...</p>
    </div>

    <div id="options-container" class="flex flex-col gap-2.5"></div>
    <div id="feedback-box" class="hidden p-4 rounded-xl text-sm leading-relaxed border"></div>

    <div class="flex gap-2 pt-2">
      <button onclick="backToMenu()" class="w-1/3 border border-slate-200 text-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-50 transition text-sm">
        Menu
      </button>
      <button id="btn-next" class="hidden w-2/3 bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 active:scale-95 transition text-sm">
        Lanjut →
      </button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://djxzfihwegavauocqrng.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_Rwc3ayh7SApcqQ-QrlQ80Q_oJ7TorOK";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Ambil data langsung sesuai pilihan secara on-demand
    async function startQuiz(filterType, filterValue) {
      const limit = parseInt(document.getElementById('limit-select').value) || 20;
      let query = supabaseClient.from('questions').select('*');

      if (filterType === 'package') {
        query = query.eq('package', filterValue);
      } else if (filterType === 'topic') {
        query = query.eq('topic', filterValue);
      }

      // Ambil hingga batas yang diinginkan
      const { data, error } = await query.limit(1000);

      if (error || !data || data.length === 0) {
        alert("Soal untuk topik ini belum ditemukan atau sedang dimuat.");
        console.error(error);
        return;
      }

      activeQuestions = shuffle(data).slice(0, limit).map(item => ({
        topic: item.topic,
        question: item.question,
        fullSentence: item.full_sentence,
        translation: item.translation,
        options: Array.isArray(item.options) ? item.options : JSON.parse(item.options),
        correct: item.correct,
        explanation: item.explanation
      }));

      currentIdx = 0;
      score = 0;
      document.getElementById("score-display").textContent = `Skor: 0`;
      document.getElementById("menu-view").classList.add("hidden");
      document.getElementById("quiz-view").classList.remove("hidden");
      
      loadQuestion();
    }

    function backToMenu() {
      document.getElementById("quiz-view").classList.add("hidden");
      document.getElementById("menu-view").classList.remove("hidden");
    }

    function loadQuestion() {
      const current = activeQuestions[currentIdx];
      document.getElementById("topic-tag").textContent = current.topic || "Latihan";
      document.getElementById("question-text").textContent = current.question;
      document.getElementById("question-translation").textContent = current.translation || "";
      document.getElementById("question-count").textContent = `Soal ${currentIdx + 1} dari ${activeQuestions.length}`;
      
      const feedbackBox = document.getElementById("feedback-box");
      const btnNext = document.getElementById("btn-next");
      const optContainer = document.getElementById("options-container");

      feedbackBox.className = "hidden";
      btnNext.classList.add("hidden");
      optContainer.innerHTML = "";

      const optionsWithIndex = current.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
      const shuffledOptions = shuffle(optionsWithIndex);

      shuffledOptions.forEach(optObj => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left px-4 py-3 border border-slate-200 rounded-xl text-slate-700 font-medium hover:border-indigo-500 hover:bg-indigo-50/30 transition text-sm";
        btn.textContent = optObj.text;
        btn.onclick = () => checkAnswer(optObj.originalIndex, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, selectedBtn) {
      const current = activeQuestions[currentIdx];
      const buttons = document.getElementById("options-container").querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);

      const feedbackBox = document.getElementById("feedback-box");
      feedbackBox.classList.remove("hidden");

      if (selectedIdx === current.correct) {
        score += 10;
        document.getElementById("score-display").textContent = `Skor: ${score}`;
        selectedBtn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-700");
        feedbackBox.className = "p-3.5 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-200";
        feedbackBox.innerHTML = `✅ <b>Jawaban Benar!</b><br>${current.explanation || ""}`;
      } else {
        selectedBtn.classList.add("bg-rose-50", "border-rose-500", "text-rose-700");
        feedbackBox.className = "p-3.5 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-200";
        feedbackBox.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban benar: <b>${current.options[current.correct]}</b><br>${current.explanation || ""}`;
      }

      document.getElementById("btn-next").classList.remove("hidden");
    }

    document.getElementById("btn-speak").addEventListener("click", () => {
      const textToSpeak = activeQuestions[currentIdx].fullSentence || activeQuestions[currentIdx].question;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      currentIdx++;
      if (currentIdx < activeQuestions.length) {
        loadQuestion();
      } else {
        document.getElementById("topic-tag").textContent = "Selesai";
        document.getElementById("question-text").textContent = "Latihan Selesai!";
        document.getElementById("question-translation").textContent = `Total skor kamu: ${score} dari ${activeQuestions.length * 10}`;
        document.getElementById("options-container").innerHTML = "";
        
        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.className = "p-4 rounded-xl text-center bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200";
        feedbackBox.innerHTML = `🎉 Selamat! Kamu telah menyelesaikan sesi kuis.<br>Skor Akhir: <b>${score}</b>`;
        feedbackBox.classList.remove("hidden");
        
        const btnNext = document.getElementById("btn-next");
        btnNext.textContent = "Kembali ke Menu Utama";
        btnNext.onclick = () => {
          btnNext.textContent = "Lanjut →";
          btnNext.onclick = null;
          backToMenu();
        };
      }
    });
  </script>
</body>
</html>

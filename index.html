<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Practice Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-md my-4 text-center">
    <h1 class="text-2xl font-bold text-indigo-600">English Practice Lab</h1>
    <p class="text-xs text-slate-500">Platform latihan soal & simulasi ujian</p>
  </header>

  <!-- 1. HALAMAN MENU PAKET SOAL -->
  <section id="menu-view" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col gap-4">
    <div>
      <h2 class="text-base font-bold text-slate-800">Pilih Paket Latihan</h2>
      <p class="text-xs text-slate-500">Soal dan opsi diacak otomatis setiap sesi</p>
    </div>

    <div class="flex flex-col gap-3">
      <button onclick="startQuiz('grammar_basic')" class="flex flex-col p-4 border border-slate-200 rounded-xl text-left hover:border-indigo-500 hover:bg-indigo-50/30 transition">
        <span class="font-bold text-sm text-slate-800">📘 Paket 1: Grammar Basics</span>
        <span class="text-xs text-slate-400 mt-1">Latihan tenses dan tata bahasa dasar</span>
      </button>

      <button onclick="startQuiz('vocab_intermediate')" class="flex flex-col p-4 border border-slate-200 rounded-xl text-left hover:border-indigo-500 hover:bg-indigo-50/30 transition">
        <span class="font-bold text-sm text-slate-800">📙 Paket 2: Vocabulary Mastery</span>
        <span class="text-xs text-slate-400 mt-1">Sinonim, antonim, dan makna kata</span>
      </button>

      <button onclick="startQuiz('all')" class="flex flex-col p-4 border-2 border-indigo-500 bg-indigo-50/40 rounded-xl text-left hover:bg-indigo-50/70 transition">
        <div class="flex justify-between items-center">
          <span class="font-bold text-sm text-indigo-700">🎯 Mode Simulasi Ujian (Acak Semua)</span>
          <span class="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded font-bold">Tryout</span>
        </div>
        <span class="text-xs text-slate-500 mt-1">Mengacak gabungan seluruh paket dari bank soal</span>
      </button>
    </div>
  </section>

  <!-- 2. HALAMAN KUIS / LATIHAN -->
  <main id="quiz-view" class="hidden w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col gap-5">
    
    <!-- Top Bar -->
    <div class="flex justify-between items-center text-xs font-semibold pb-2 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <span id="topic-tag" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">Grammar</span>
        <span id="question-count" class="text-slate-400">Soal 1 dari 5</span>
      </div>
      <span class="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full" id="score-display">Skor: 0</span>
    </div>

    <!-- Soal & Tombol Suara -->
    <div>
      <div class="flex items-start justify-between gap-2">
        <h2 id="question-text" class="text-lg font-semibold text-slate-800 leading-snug">...</h2>
        <button id="btn-speak" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Dengarkan Contoh Kalimat">
          🔊
        </button>
      </div>
      <p id="question-translation" class="text-xs text-slate-400 mt-1.5 italic">...</p>
    </div>

    <!-- Pilihan Jawaban -->
    <div id="options-container" class="flex flex-col gap-2.5"></div>

    <!-- Penjelasan Feedback -->
    <div id="feedback-box" class="hidden p-3.5 rounded-xl text-sm leading-relaxed"></div>

    <!-- Tombol Navigasi -->
    <div class="flex gap-2">
      <button onclick="backToMenu()" class="w-1/3 border border-slate-200 text-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-50 transition text-sm">
        Kembali
      </button>
      <button id="btn-next" class="hidden w-2/3 bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 active:scale-95 transition text-sm">
        Lanjut →
      </button>
    </div>
  </main>

  <script>
    // Bank Soal Terpadu
    const questionsDatabase = [
      {
        id: 1,
        package: "grammar_basic",
        topic: "Simple Present",
        question: "She ___ to school every morning.",
        fullSentence: "She goes to school every morning.",
        translation: "Dia pergi ke sekolah setiap pagi.",
        options: ["go", "goes", "went", "going"],
        correct: 1,
        explanation: "Subjek tunggal 'She' pada Simple Present Tense menggunakan verb + s/es (goes)."
      },
      {
        id: 2,
        package: "grammar_basic",
        topic: "Past Tense",
        question: "They ___ to Bali last holiday.",
        fullSentence: "They went to Bali last holiday.",
        translation: "Mereka pergi ke Bali liburan lalu.",
        options: ["go", "goes", "went", "gone"],
        correct: 2,
        explanation: "Keterangan waktu 'last holiday' menandakan bentuk lampau / Simple Past (went)."
      },
      {
        id: 3,
        package: "vocab_intermediate",
        topic: "Synonyms",
        question: "What is the synonym of 'Abundant'?",
        fullSentence: "The synonym of abundant is plentiful.",
        translation: "Apa sinonim dari 'Abundant' (melimpah)?",
        options: ["Scarce", "Plentiful", "Tiny", "Empty"],
        correct: 1,
        explanation: "'Abundant' dan 'Plentiful' memiliki arti yang sama, yaitu berlimpah ruah."
      },
      {
        id: 4,
        package: "vocab_intermediate",
        topic: "Antonyms",
        question: "What is the opposite of 'Generous'?",
        fullSentence: "The opposite of generous is stingy.",
        translation: "Apa lawan kata dari 'Generous' (dermawan)?",
        options: ["Kind", "Helpful", "Stingy", "Friendly"],
        correct: 2,
        explanation: "Lawan kata dermawan adalah 'Stingy' (pelit/kikir)."
      },
      {
        id: 5,
        package: "grammar_basic",
        topic: "Passive Voice",
        question: "The novel ___ by J.K. Rowling in 1997.",
        fullSentence: "The novel was written by J.K. Rowling in 1997.",
        translation: "Novel tersebut ditulis oleh J.K. Rowling pada tahun 1997.",
        options: ["writes", "wrote", "was written", "is writing"],
        correct: 2,
        explanation: "Pola pasif lampau: was/were + Verb 3 (was written)."
      }
    ];

    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;

    // Fungsi Pengacak
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz(packageName) {
      if (packageName === 'all') {
        activeQuestions = shuffle(questionsDatabase);
      } else {
        const filtered = questionsDatabase.filter(q => q.package === packageName);
        activeQuestions = shuffle(filtered.length > 0 ? filtered : questionsDatabase);
      }

      currentIdx = 0;
      score = 0;
      document.getElementById("score-display").textContent = `Skor: ${score}`;
      document.getElementById("menu-view").classList.add("hidden");
      document.getElementById("quiz-view").classList.remove("hidden");
      
      loadQuestion();
    }

    function backToMenu() {
      document.getElementById("quiz-view").classList.add("hidden");
      document.getElementById("menu-view").classList.remove("hidden");
    }

    function loadQuestion() {
      const current = activeQuestions[currentIdx];
      document.getElementById("topic-tag").textContent = current.topic || "Latihan";
      document.getElementById("question-text").textContent = current.question;
      document.getElementById("question-translation").textContent = current.translation || "";
      document.getElementById("question-count").textContent = `Soal ${currentIdx + 1} dari ${activeQuestions.length}`;
      
      const feedbackBox = document.getElementById("feedback-box");
      const btnNext = document.getElementById("btn-next");
      const optContainer = document.getElementById("options-container");

      feedbackBox.className = "hidden";
      btnNext.classList.add("hidden");
      optContainer.innerHTML = "";

      // Acak urutan pilihan jawaban
      const optionsWithIndex = current.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
      const shuffledOptions = shuffle(optionsWithIndex);

      shuffledOptions.forEach(optObj => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left px-4 py-3 border border-slate-200 rounded-xl text-slate-700 font-medium hover:border-indigo-500 hover:bg-indigo-50/30 transition";
        btn.textContent = optObj.text;
        btn.onclick = () => checkAnswer(optObj.originalIndex, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, selectedBtn) {
      const current = activeQuestions[currentIdx];
      const buttons = document.getElementById("options-container").querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);

      const feedbackBox = document.getElementById("feedback-box");
      feedbackBox.classList.remove("hidden");

      if (selectedIdx === current.correct) {
        score += 10;
        document.getElementById("score-display").textContent = `Skor: ${score}`;
        selectedBtn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-700");
        feedbackBox.className = "p-3.5 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-200";
        feedbackBox.innerHTML = `✅ <b>Jawaban Benar!</b><br>${current.explanation || ""}`;
      } else {
        selectedBtn.classList.add("bg-rose-50", "border-rose-500", "text-rose-700");
        feedbackBox.className = "p-3.5 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-200";
        feedbackBox.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban benar: <b>${current.options[current.correct]}</b><br>${current.explanation || ""}`;
      }

      document.getElementById("btn-next").classList.remove("hidden");
    }

    // Suara Pengucapan Kalimat
    document.getElementById("btn-speak").addEventListener("click", () => {
      const textToSpeak = activeQuestions[currentIdx].fullSentence || activeQuestions[currentIdx].question;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      currentIdx++;
      if (currentIdx < activeQuestions.length) {
        loadQuestion();
      } else {
        document.getElementById("topic-tag").textContent = "Selesai";
        document.getElementById("question-text").textContent = "Latihan Selesai!";
        document.getElementById("question-translation").textContent = `Total skor kamu: ${score} / ${activeQuestions.length * 10}`;
        document.getElementById("options-container").innerHTML = "";
        
        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.className = "p-4 rounded-xl text-center bg-indigo-50 text-indigo-700 font-semibold";
        feedbackBox.textContent = `Paket selesai dikerjakan! Skor: ${score}`;
        feedbackBox.classList.remove("hidden");
        
        const btnNext = document.getElementById("btn-next");
        btnNext.textContent = "Kembali ke Menu";
        btnNext.onclick = () => {
          btnNext.textContent = "Lanjut →";
          btnNext.onclick = null;
          backToMenu();
        };
      }
    });
  </script>
</body>
</html>
